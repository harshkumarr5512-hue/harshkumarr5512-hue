name: Refresh Living Terminal Graph

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/requirements-daily.txt

      - name: Fetch contribution data
        run: python tools/pull_contributions.py

      - name: Generate contribution graph
        run: python tools/render_graph.py

      - name: Generate terminal panel
        run: python tools/render_panel.py

      - name: Generate ASCII portrait
        run: python tools/render_portrait.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graph.svg sysinfo.svg portrait.svg assets/contributions.json
          git diff --cached --quiet || git commit -m "Update Living Terminal"
          git push
